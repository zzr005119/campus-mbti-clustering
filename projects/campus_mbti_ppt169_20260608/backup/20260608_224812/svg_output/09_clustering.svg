"265" height="200" fill="#FFF0F3" rx="14" stroke="yl" stroke-width="2"/><text x="650" y="170" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="20" fill="#2D3436">群体 2</text><text x="650" y="205" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="22" fill="yl">社交体验型</text><text x="650" y="235" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" fill="#636E72">月预算 3.07 | 14人</text><text x="650" y="260" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12" fill="#B2BEC3">社交2.64 服饰2.21</text><text x="650" y="285" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12" fill="#B2BEC3">主流MBTI: XSFP</text><rect x="915" y="130" width="265" height="200" fill="#FFF0F3" rx="14" stroke="pp" stroke-width="2"/><text x="935" y="170" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="20" fill="#2D3436">群体 3</text><text x="935" y="205" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="22" fill="pp">自我提升型</text><text x="935" y="235" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" fill="#636E72">月预算 3.15 | 13人</text><text x="935" y="260" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12" fill="#B2BEC3">学习3.0 兴趣2.38 服饰2.77</text><text x="935" y="285" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12" fill="#B2BEC3">主流MBTI: XNFP</text><rect x="60" y="360" width="560" height="310" fill="#2D3436" rx="14"/><text x="340" y="400" text-anchor="middle" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="18" fill="#FFD93D">关键发现</text><text x="100" y="440" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#B2BEC3">节俭生存型占比最大 (37.1%)</text><text x="100" y="468" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#B2BEC3">高消费数码型预算最高但人数最少</text><text x="100" y="496" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#B2BEC3">自我提升型学习投入最高 (3.0)</text><text x="100" y="524" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#B2BEC3">社交体验型社交支出远超其他群体</text><text x="100" y="552" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#B2BEC3">四类群体之间特征差异显著</text><text x="100" y="580" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#55EFC4">K=4时轮廓系数最优，聚类效果良好</text><image x="645" y="375" width="535" height="280" xlink:href="../images/output_radar.png" preserveAspectRatio="xMidYMid meet"/><text x="1240" y="700" text-anchor="end" font-family="Arial Black, Microsoft YaHei, sans-serif" font-size="14" fill="#B2BEC3">09 / 14</text></svg>