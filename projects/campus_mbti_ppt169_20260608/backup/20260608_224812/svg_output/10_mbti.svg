="15" fill="#FFD93D">51.6%</text><rect x="80" y="325" width="520" height="35" fill="#FFFAFB" rx="6"/><text x="100" y="347" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="15" fill="#636E72">J/P 生活风格</text><text x="400" y="347" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="15" fill="#00D2D3">2分类</text><text x="520" y="347" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="15" fill="#A29BFE">48.4%</text><rect x="650" y="130" width="570" height="230" fill="#2D3436" rx="14"/><text x="935" y="170" text-anchor="middle" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="18" fill="#FFD93D">方法说明</text><text x="690" y="210" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#B2BEC3">分类器：Random Forest (n=100, depth=5)</text><text x="690" y="238" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#B2BEC3">验证：LOOCV 留一法交叉验证</text><text x="690" y="266" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#B2BEC3">不平衡：SMOTENC 过采样</text><text x="690" y="294" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#B2BEC3">特征：12维 (5消费+4行为+3人口学)</text><text x="690" y="322" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#B2BEC3">目标：4个独立RF x MBTI四维</text><rect x="60" y="390" width="560" height="250" fill="#FFF0F3" rx="14" stroke="#FFD93D" stroke-width="2"/><text x="100" y="425" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="18" fill="#FF6B8A">核心发现</text><text x="100" y="470" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#FF6B8A">S/N维度预测效果最好 (61.3%)</text><text x="100" y="498" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">验证了消费行为可预测MBTI的假设</text><text x="100" y="526" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">E/I维度受限于仅9份外倾样本</text><text x="100" y="554" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">数码游戏是预测E/I的最重要特征</text><text x="100" y="582" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">餐饮伙食是预测S/N的最重要特征</text><image x="640" y="400" width="580" height="230" xlink:href="../images/output_feature_importance.png" preserveAspectRatio="xMidYMid meet"/><text x="1240" y="700" text-anchor="end" font-family="Arial Black, Microsoft YaHei, sans-serif" font-size="14" fill="#B2BEC3">10 / 14</text></svg>