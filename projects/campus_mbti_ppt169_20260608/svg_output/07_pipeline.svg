<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFFAFB"/><circle cx="1200" cy="100" r="200" fill="#FDE8EC" fill-opacity="0.5"/><circle cx="100" cy="650" r="120" fill="#FFF0F3" fill-opacity="0.4"/><circle cx="120" cy="80" r="8" fill="#FFD93D" fill-opacity="0.45"/><circle cx="1150" cy="650" r="10" fill="#A29BFE" fill-opacity="0.4"/><circle cx="60" cy="600" r="6" fill="#00D2D3" fill-opacity="0.35"/><rect x="60" y="32" width="1160" height="56" fill="#2D3436" rx="10"/><text x="100" y="68" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="24" fill="#FFD93D">三阶段技术路线</text><text x="1240" y="68" text-anchor="end" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#B2BEC3">K-Means Clustering → Random Forest → Recommendation System</text><rect x="60" y="92" width="1160" height="3" fill="#FF6B8A" fill-opacity="0.6"/><rect x="60" y="120" width="340" height="440" fill="#FFF0F3" rx="16" stroke="#FF6B8A" stroke-width="2"/><rect x="85" y="145" width="55" height="55" fill="#FF6B8A" rx="12"/><text x="112" y="180" text-anchor="middle" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="24" fill="#FFFFFF">01</text><text x="160" y="180" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="20" fill="#FF6B8A">无监督聚类</text><rect x="85" y="215" width="280" height="2" fill="#FFD93D"/><text x="85" y="250" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">K-Means 聚类算法</text><text x="85" y="285" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">肘部法则 + 轮廓系数</text><text x="85" y="320" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">最优聚类数 K=4</text><text x="85" y="355" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">识别四类消费群体</text><text x="85" y="390" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">产出：雷达/热力图/PCA</text><rect x="420" y="120" width="340" height="440" fill="#FFF0F3" rx="16" stroke="#00D2D3" stroke-width="2"/><rect x="445" y="145" width="55" height="55" fill="#00D2D3" rx="12"/><text x="472" y="180" text-anchor="middle" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="24" fill="#FFFFFF">02</text><text x="520" y="180" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="20" fill="#00D2D3">有监督分类</text><rect x="445" y="215" width="280" height="2" fill="#FFD93D"/><text x="445" y="250" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">Random Forest 分类器</text><text x="445" y="285" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">LOOCV 留一法验证</text><text x="445" y="320" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">SMOTENC 过采样</text><text x="445" y="355" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">4维独立分类模型</text><text x="445" y="390" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">Bootstrap 95% CI + AUC</text><rect x="780" y="120" width="340" height="440" fill="#FFF0F3" rx="16" stroke="#A29BFE" stroke-width="2"/><rect x="805" y="145" width="55" height="55" fill="#A29BFE" rx="12"/><text x="832" y="180" text-anchor="middle" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="24" fill="#FFFFFF">03</text><text x="880" y="180" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="20" fill="#A29BFE">推荐系统</text><rect x="805" y="215" width="280" height="2" fill="#FFD93D"/><text x="805" y="250" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">Flask Web 后端 API</text><text x="805" y="285" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">浅粉孟菲斯前端</text><text x="805" y="320" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">Cosine 相似度匹配</text><text x="805" y="355" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">MBTI互补 + 预算匹配</text><text x="805" y="390" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#636E72">TOP-5 个性化搭子推荐</text><polygon points="405,340 425,350 405,360" fill="#2D3436" fill-opacity="0.3"/><polygon points="765,340 785,350 765,360" fill="#2D3436" fill-opacity="0.3"/><rect x="60" y="600" width="1160" height="55" fill="#2D3436" rx="10"/><text x="640" y="635" text-anchor="middle" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="18" fill="#FFD93D">Pipeline:  数据清洗  →  特征工程  →  模型训练  →  交叉验证  →  推理部署  →  前端交互</text><text x="1240" y="704" text-anchor="end" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="12" fill="#B2BEC3">07 / 15</text><text x="1240" y="704" text-anchor="end" font-family="Arial Black,Microsoft YaHei,sans-serif" font-size="12" fill="#B2BEC3">07 / 15</text></svg>